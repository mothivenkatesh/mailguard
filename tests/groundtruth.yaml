  # Typo cases. Many squatted typo domains DO have A records (domain
  # parking), so they land in `risky` rather than `undeliverable`. A few
  # have been fully decommissioned and return no MX at all — those land in
  # `undeliverable`. Labels reflect measured reality at benchmark time.
