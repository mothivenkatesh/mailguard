# Ground-truth labels for mailguard accuracy measurement.
#
# METHODOLOGY
# -----------
# Labels describe the EXPECTED VERDICT (deliverable / risky / undeliverable)
# for each address — not claims about mailbox existence. mailguard does not
# attempt to prove a specific mailbox exists without the permission of the
# domain owner; the benchmark measures whether the layered verdict agrees
# with what a human list-hygiene reviewer would assign.
#
# Categories:
#   deliverable   — valid syntax, live domain, non-disposable, non-role,
#                   non-typo. A human reviewer would send to it.
#   risky         — role-based, typo-suggested, or catch-all domain.
#                   A human reviewer would keep but flag for review.
#   undeliverable — bad syntax, disposable, no MX, or known dead domain.
#                   A human reviewer would drop it.
#
# We deliberately use only public domains (stripe, github, google, etc.) and
# fictional mailbox names (info@, test@, random local parts). No real
# individual's email address is included.
#
# Run the benchmark:
#     python benchmarks/accuracy.py
#
# Source: maintained in-repo. Contributions welcome via PR.

cases:
