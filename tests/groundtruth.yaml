  - { email: "security@dropbox.com",      expected: risky, note: "role address" }
  - { email: "privacy@linkedin.com",      expected: risky, note: "role address" }

  # =========================================================================
  # UNDELIVERABLE — 40 cases
  # Bad syntax, disposable, no MX. Expected verdict: undeliverable.
  # =========================================================================
  - { email: "",                          expected: undeliverable, note: "empty" }
  - { email: "notanemail",                expected: undeliverable, note: "no @" }
  - { email: "@example.com",              expected: undeliverable, note: "no local" }
  - { email: "foo@",                      expected: undeliverable, note: "no domain" }
  - { email: "foo@@bar.com",              expected: undeliverable, note: "double @" }
  - { email: "foo@bar",                   expected: undeliverable, note: "no TLD" }
  - { email: "foo bar@baz.com",           expected: undeliverable, note: "space in local" }
  - { email: "foo@bar .com",              expected: undeliverable, note: "space in domain" }
  - { email: ".foo@bar.com",              expected: undeliverable, note: "leading dot" }
  - { email: "foo.@bar.com",              expected: undeliverable, note: "trailing dot" }
  - { email: "test@mailinator.com",       expected: undeliverable, note: "disposable" }
  - { email: "user@yopmail.com",          expected: undeliverable, note: "disposable" }
