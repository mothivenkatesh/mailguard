[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mailguard"
version = "0.2.0"
description = "Async bulk email validator with 9-layer deliverability scoring. Free, privacy-first alternative to ZeroBounce/NeverBounce for GTM marketers."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "mailguard contributors" }]
keywords = [
    "email", "email-validation", "email-verification", "deliverability",
    "smtp", "bulk-email", "lead-generation", "gtm", "marketing",
    "disposable-email", "catch-all", "typo-correction", "async", "cli"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Email",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "email-validator>=2.1.0",
    "dnspython>=2.4.0",
    "aiodns>=3.1.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
web = ["streamlit>=1.30.0", "pandas>=2.0.0", "plotly>=5.18.0"]
api = ["fastapi>=0.109.0", "uvicorn>=0.27.0"]
dev = ["pytest>=7.4.0", "pytest-asyncio>=0.23.0", "pytest-cov>=4.1.0", "ruff>=0.2.0", "mypy>=1.8.0", "pre-commit>=3.6.0"]
all = ["mailguard[web,api,dev]"]

[project.scripts]
mailguard = "mailguard.cli:app"

[project.urls]
Homepage = "https://github.com/mothivenkatesh/mailguard"
Documentation = "https://github.com/mothivenkatesh/mailguard#readme"
Repository = "https://github.com/mothivenkatesh/mailguard"
Issues = "https://github.com/mothivenkatesh/mailguard/issues"
Changelog = "https://github.com/mothivenkatesh/mailguard/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["mailguard"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra -q --cov=mailguard --cov-report=term-missing"
